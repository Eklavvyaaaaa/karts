<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rush Local Controller</title><link rel="stylesheet" href="/controller.css"></head><body><main class="controller-shell"><header><b>R</b><div><strong>RUSH//LOCAL</strong><small id="player">CONNECTING</small></div><span id="connection">OFFLINE</span></header><section id="onboarding" class="panel"><small>PHONE CONTROLLER</small><h1>CONNECT TO RACE</h1><p>Hold your phone sideways. Motion sensors require HTTPS permission.</p><button id="enable" class="primary">ENABLE MOTION</button><button id="touch" class="secondary">USE TOUCH CONTROLS</button><p id="error" class="error"></p></section><section id="controller" hidden><h2 id="assigned">PLAYER</h2><button id="calibrate" class="calibrate">CALIBRATE NEUTRAL</button><div class="steering"><span>STEER</span><div><i id="dot"></i></div><small>TILT PHONE LEFT / RIGHT</small></div><div class="controls"><button data-input="accelerate" class="primary">ACCELERATE</button><button data-input="brake">BRAKE</button><button data-input="drift">DRIFT</button><button data-input="boost">BOOST</button><button data-input="item">ITEM</button></div><p id="sensor">TOUCH READY</p></section></main><script src="/socket.io/socket.io.js"></script><script src="/controller.js"></script></body></html>
